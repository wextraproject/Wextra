name: APK oluştur

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Repository indiriliyor
        uses: actions/checkout@v4

      - name: Java 17 kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9 kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: ZIP dosyasını aç
        run: |
          unzip -o wextra.zip -d project

      - name: Proje dosyasını bul ve düzelt
        run: |
          find project -name "build.gradle.kts" -type f

          python3 - <<'PYTHON'
          from pathlib import Path

          files = list(Path("project").rglob("app/build.gradle.kts"))

          if not files:
              raise Exception("app/build.gradle.kts bulunamadı!")

          file = files[0]

          text = file.read_text()

          if "compileOptions {" not in text:
              text = text.replace(
                  "    buildFeatures {",
                  """    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = "17"
          }

          buildFeatures {"""
              )

          file.write_text(text)

          print("Düzeltilen dosya:", file)
          print(file.read_text())
          PYTHON

      - name: SHA-1 kodunu göster
        run: |
          PROJECT=$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)

          echo "Proje: $PROJECT"

          cd "$PROJECT"

          gradle signingReport

      - name: APK oluştur
        run: |
          PROJECT=$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)

          echo "Proje: $PROJECT"

          cd "$PROJECT"

          gradle clean assembleDebug --stacktrace

      - name: APK dosyasını bul
        run: |
          find project -name "app-debug.apk"

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: wextra-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
